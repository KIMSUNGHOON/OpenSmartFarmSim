worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr emerg;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 512k;
    client_body_temp_path /tmp/client-temp;
    proxy_temp_path /tmp/proxy-temp;
    fastcgi_temp_path /tmp/fastcgi-temp;
    uwsgi_temp_path /tmp/uwsgi-temp;
    scgi_temp_path /tmp/scgi-temp;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server {
        listen 8444 ssl;
        ssl_certificate /run/operator/web/cert.pem;
        ssl_certificate_key /run/operator/web/key.pem;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location ~ ^/(?:v1(?:/|$)|openapi\.json$) {
            proxy_pass https://127.0.0.1:8443;
            proxy_ssl_trusted_certificate /run/operator/web/api-ca.pem;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
    }
}
