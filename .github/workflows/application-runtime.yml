name: Application runtime verification

on:
  push:
    branches: [main, 'ci/application-runtime']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and verify isolated application images
        env:
          DOCKER_BUILDKIT: '1'
        run: python3 scripts/check-application-images.py
