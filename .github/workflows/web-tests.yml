name: Web tests

on:
  workflow_dispatch:
    inputs:
      browser_suite:
        description: Browser acceptance scope (all is the complete regression gate)
        type: choice
        default: all
        options: [all, connection, solar]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web (${{ inputs.browser_suite || 'all' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
      - run: npm install --global npm@11.16.0
      - run: npm ci --strict-peer-deps
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx --no-install playwright install --with-deps chromium
      - name: Browser acceptance
        env:
          OSSF_BROWSER_SUITE: ${{ inputs.browser_suite || 'all' }}
        run: |
          case "$OSSF_BROWSER_SUITE" in
            all)
              npm run test:browser -- --reporter=line --max-failures=1
              ;;
            connection)
              npm run test:browser -- --reporter=line --max-failures=1 connection-entry.spec.ts assessment.spec.ts authored-financial.spec.ts break-even.spec.ts
              ;;
            solar)
              npm run test:browser -- --reporter=line --max-failures=1 greenhouse-solar-replay.spec.ts greenhouse-ventilation-replay.spec.ts joint-crop-climate-replay.spec.ts
              ;;
            *) exit 1 ;;
          esac
      - name: Recorded Solar UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solar-recorded-ui-${{ github.sha }}
          path: research/artifacts/greenhouse-solar-*.png
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
