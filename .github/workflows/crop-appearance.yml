name: Crop appearance viewer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
      - run: npm install --global npm@11.16.0
      - run: npm ci --strict-peer-deps
      - run: npm run typecheck
      - run: npm run test -- src/tomatoAppearance.test.ts
      - run: npx --no-install vite build --config vite.crop-appearance.config.ts
      - run: npm audit --audit-level=high
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser -- --config playwright.appearance.config.ts --reporter=line --max-failures=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tomato-appearance-${{ github.sha }}
          path: |
            web/dist-crop-appearance
            research/artifacts/tomato-appearance-*-20261021.png
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
