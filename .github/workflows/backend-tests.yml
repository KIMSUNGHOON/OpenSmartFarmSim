name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
          python-version: "3.12.13"
          enable-cache: false

      - name: Install locked backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12.13
          uv lock --check
          uv sync --locked --group dev --python 3.12.13
          uv run --no-sync python -c 'import sys; assert sys.version_info[:3] == (3, 12, 13)'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'

      - name: Install locked browser smoke dependencies
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          npm ci --strict-peer-deps
          npx --no-install playwright install --with-deps chromium

      - name: Prepare readable runtime for UID service smoke
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uid_runtime="/tmp/ossf-uid-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 755 -- "$uid_runtime"
          uv python install --no-cache --no-bin --install-dir "$uid_runtime/python" 3.12.13
          UV_PYTHON_INSTALL_DIR="$uid_runtime/python" UV_PROJECT_ENVIRONMENT="$uid_runtime/venv" \
            uv sync --locked --group dev --python 3.12.13 --link-mode copy
          mkdir -p -- "$uid_runtime/code/backend/tests" "$uid_runtime/code/contracts"
          cp -R -- "$GITHUB_WORKSPACE/backend/app" "$uid_runtime/code/backend/app"
          cp -- "$GITHUB_WORKSPACE/backend/tests/uid_supervisor_factory.py" \
            "$GITHUB_WORKSPACE/backend/tests/uid_authority_factory.py" \
            "$GITHUB_WORKSPACE/backend/tests/uid_planning_factory.py" \
            "$GITHUB_WORKSPACE/backend/tests/uid_planning_client.py" \
            "$GITHUB_WORKSPACE/backend/tests/test_job_evidence.py" \
            "$GITHUB_WORKSPACE/backend/tests/test_jobs.py" \
            "$GITHUB_WORKSPACE/backend/tests/test_cli_contracts.py" "$uid_runtime/code/backend/tests/"
          cp -- "$GITHUB_WORKSPACE/contracts/decision-v1.schema.json" "$uid_runtime/code/contracts/"
          chmod -R go-w,a+rX -- "$uid_runtime"
          "$uid_runtime/venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 13)'

      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          db_image='postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650'
          grep -Fqx "    image: $db_image" compose.yaml
          db_container="ossf-backend-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          secret_dir="${RUNNER_TEMP}/${db_container}"
          mkdir -m 700 -- "$secret_dir"
          umask 077
          openssl rand -hex 32 > "$secret_dir/password"
          cp -- "$secret_dir/password" "$secret_dir/container_password"
          sudo chown 999:999 -- "$secret_dir/container_password"

          docker run --detach --name "$db_container" \
            --mount "type=bind,source=$secret_dir/container_password,target=/run/secrets/db_password,readonly" \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/db_password \
            --env POSTGRES_USER=ossf_ci \
            --env POSTGRES_DB=ossf_ci \
            --publish 127.0.0.1::5432 \
            --health-cmd='pg_isready -h 127.0.0.1 -U ossf_ci -d ossf_ci' \
            --health-interval=2s --health-timeout=3s \
            --health-start-period=10s --health-retries=30 \
            "$db_image" >/dev/null

          for _ in {1..60}; do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$db_container" 2>/dev/null || true)"
            if [[ "$state" == healthy ]]; then
              exit 0
            fi
            if [[ "$state" == unhealthy ]]; then
              break
            fi
            sleep 2
          done
          printf 'PostgreSQL did not become healthy.\n' >&2
          exit 1

      - name: Run backend tests against PostgreSQL
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          db_container="ossf-backend-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          secret_dir="${RUNNER_TEMP}/${db_container}"
          mapping="$(docker port "$db_container" 5432/tcp)"
          if [[ ! "$mapping" =~ ^127[.]0[.]0[.]1:([0-9]+)$ ]]; then
            printf 'Expected one loopback PostgreSQL port.\n' >&2
            exit 1
          fi
          port="${BASH_REMATCH[1]}"
          umask 077
          printf '127.0.0.1:%s:ossf_ci:ossf_ci:%s\n' \
            "$port" "$(cat -- "$secret_dir/password")" > "$secret_dir/pgpass"
          export PGPASSFILE="$secret_dir/pgpass"
          export OSSF_TEST_PG_DSN="host=127.0.0.1 port=$port dbname=ossf_ci user=ossf_ci"

          uv run --no-sync python -c 'import os, psycopg; psycopg.connect(os.environ["OSSF_TEST_PG_DSN"]).close()'
          uid_runtime="/tmp/ossf-uid-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo -- env OSSF_TEST_PG_DSN="$OSSF_TEST_PG_DSN" PGPASSFILE="$PGPASSFILE" \
            "$uid_runtime/venv/bin/python" -B -m pytest -p no:cacheprovider -q -s \
              tests/uid_service_smoke.py tests/uid_planning_smoke.py
          uv run --no-sync pytest -q -rs
          uv run --no-sync pytest -q -s tests/web_authored_thermal_replay_smoke.py

      - name: Check content access with distinct Linux UIDs
        shell: bash
        run: |
          set -euo pipefail
          sudo -- "$GITHUB_WORKSPACE/backend/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/check-content-uid-boundary.py"

      - name: Remove database and password files
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          db_container="ossf-backend-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          secret_dir="${RUNNER_TEMP}/${db_container}"
          status=0
          if docker container inspect "$db_container" >/dev/null 2>&1; then
            docker rm -fv "$db_container" >/dev/null 2>&1 || status=1
          fi
          rm -rf -- "$secret_dir" || status=1
          uid_runtime="/tmp/ossf-uid-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo -- rm -rf -- "$uid_runtime" || status=1
          exit "$status"
